AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates a dummy Lambda function tagged for AWSO metrics tag filter validation.
  Used in PreRequisitesInfra to generate Lambda CloudTrail events and CloudWatch metrics.

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Tags:
        - Key: CreatedBy
          Value: sumocfntester
        - Key: dev
          Value: "true"

  DummyLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 200, "body": "ok"}
      Tags:
        - Key: CreatedBy
          Value: sumocfntester
        - Key: dev
          Value: "true"

Outputs:
  LambdaFunctionName:
    Value: !Ref DummyLambdaFunction
  LambdaFunctionArn:
    Value: !GetAtt DummyLambdaFunction.Arn
