AWSTemplateFormatVersion: '2010-09-09'
Description: Creates an ELB Classic with an EC2 instance running a web server in the default VPC.

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP inbound for ELB and instance
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  WebInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT5M
    Properties:
      InstanceType: t3.nano
      ImageId: !FindInMap [RegionAMI, !Ref "AWS::Region", AMI]
      SecurityGroupIds:
        - !Ref SecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          yum install -y httpd aws-cfn-bootstrap
          echo "OK" > /var/www/html/index.html
          systemctl start httpd
          systemctl enable httpd
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource WebInstance --region ${AWS::Region}
      Tags:
        - Key: Name
          Value: !Sub "test-automation-elb-instance-${AWS::StackName}"
        - Key: Environment
          Value: test-automation
        - Key: CreatedBy
          Value: sumocfntester


  Elb:
    Type: AWS::ElasticLoadBalancing::LoadBalancer
    Properties:
      AvailabilityZones:
        - !GetAtt WebInstance.AvailabilityZone
      Instances:
        - !Ref WebInstance
      SecurityGroups:
        - !GetAtt SecurityGroup.GroupId
      Listeners:
        - LoadBalancerPort: 80
          InstancePort: 80
          Protocol: HTTP
      HealthCheck:
        Target: "HTTP:80/index.html"
        HealthyThreshold: 2
        UnhealthyThreshold: 5
        Interval: 30
        Timeout: 5
      Tags:
        - Key: Name
          Value: !Sub "test-automation-elb-${AWS::StackName}"
        - Key: Environment
          Value: test-automation
        - Key: CreatedBy
          Value: sumocfntester

