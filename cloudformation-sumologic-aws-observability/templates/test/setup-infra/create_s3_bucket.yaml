AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create an S3 bucket with a random prefix.

Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub
        - "test-automation-awso-${UniqueId}"
        - UniqueId: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]

Outputs:
  BucketName:
    Description: Name of the S3 bucket created.
    Value: !Ref S3Bucket