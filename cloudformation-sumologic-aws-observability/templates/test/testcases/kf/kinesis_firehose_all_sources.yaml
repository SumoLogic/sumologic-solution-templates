---
Global:
  TemplatePath: "https://sumologic-appdev-aws-sam-apps.s3.amazonaws.com/aws-observability-versions/v3.0.0/templates/sumologic_observability.master.template.yaml"
  StackName: AWSO
  ParallelTestsRun: 1
  GlobalParameters:
    Default:
      Section1eSumoLogicResourceRemoveOnDeleteStack: 'true'
      Section2aAccountAlias: 'kfall'
TestCase:
  TestName: kinesisFirehoseAllSources
  Regions: '${SUMO_REGIONS}'
  Skip: false

  PreRequisitesInfra:
    - Name: CreateALBInfra
      CFNTemplateURL: "test/setup-infra/create_alb_infra.yaml"
      ImpactedParametersPath:
        AlbArn:
          - "assertions[AssertType==AWSResourceValidation].Assert['ALB#LoadBalancers#0'].Arn"
        AlbDns:
          - "assertions[AssertType==AWSResourceValidation].Assert['ALB#LoadBalancers#0'].DnsName"
    - Name: CreateELBInfra
      CFNTemplateURL: "test/setup-infra/create_elb_infra.yaml"
      ImpactedParametersPath:
        ElbName:
          - "assertions[AssertType==AWSResourceValidation].Assert['ELB#LoadBalancers#0'].Name"
        ElbDns:
          - "assertions[AssertType==AWSResourceValidation].Assert['ELB#LoadBalancers#0'].DnsName"
    - Name: CreateCWLogGroups
      CFNTemplateURL: "test/setup-infra/create_cloudwatch_loggroups.yaml"
      ImpactedParametersPath:
        LogGroupByPatternName:
          - "assertions[AssertType==AWSResourceValidation].Assert['CloudWatchLogGroups#ExistingLogGroups#0'].Name"
        LogGroupByPatternArn:
          - "assertions[AssertType==AWSResourceValidation].Assert['CloudWatchLogGroups#ExistingLogGroups#0'].Arn"
        LogGroupByTagsName:
          - "assertions[AssertType==AWSResourceValidation].Assert['CloudWatchLogGroups#ExistingLogGroups#1'].Name"
        LogGroupByTagsArn:
          - "assertions[AssertType==AWSResourceValidation].Assert['CloudWatchLogGroups#ExistingLogGroups#1'].Arn"
        LogGroupBothName:
          - "assertions[AssertType==AWSResourceValidation].Assert['CloudWatchLogGroups#ExistingLogGroups#2'].Name"
        LogGroupBothArn:
          - "assertions[AssertType==AWSResourceValidation].Assert['CloudWatchLogGroups#ExistingLogGroups#2'].Arn"

  PostRequisitesInfra:
    - Name: CreateALBInfra
      CFNTemplateURL: "test/setup-infra/create_alb_infra.yaml"
      WaitSeconds:
      ImpactedParametersPath:
        AlbArn:
          - "assertions[AssertType==AWSResourceValidation].Assert['ALB#LoadBalancers#1'].Arn"
        AlbDns:
          - "assertions[AssertType==AWSResourceValidation].Assert['ALB#LoadBalancers#1'].DnsName"
    - Name: CreateELBInfra
      CFNTemplateURL: "test/setup-infra/create_elb_infra.yaml"
      WaitSeconds:
      ImpactedParametersPath:
        ElbName:
          - "assertions[AssertType==AWSResourceValidation].Assert['ELB#LoadBalancers#1'].Name"
        ElbDns:
          - "assertions[AssertType==AWSResourceValidation].Assert['ELB#LoadBalancers#1'].DnsName"
    - Name: CreateCWLogGroups
      CFNTemplateURL: "test/setup-infra/create_cloudwatch_loggroups.yaml"
      WaitSeconds:
      ImpactedParametersPath:
        LogGroupByPatternName:
          - "assertions[AssertType==AWSResourceValidation].Assert['CloudWatchLogGroups#NewLogGroups#0'].Name"
        LogGroupByPatternArn:
          - "assertions[AssertType==AWSResourceValidation].Assert['CloudWatchLogGroups#NewLogGroups#0'].Arn"
        LogGroupByTagsName:
          - "assertions[AssertType==AWSResourceValidation].Assert['CloudWatchLogGroups#NewLogGroups#1'].Name"
        LogGroupByTagsArn:
          - "assertions[AssertType==AWSResourceValidation].Assert['CloudWatchLogGroups#NewLogGroups#1'].Arn"
        LogGroupBothName:
          - "assertions[AssertType==AWSResourceValidation].Assert['CloudWatchLogGroups#NewLogGroups#2'].Name"
        LogGroupBothArn:
          - "assertions[AssertType==AWSResourceValidation].Assert['CloudWatchLogGroups#NewLogGroups#2'].Arn"

  Parameters:
    Values:
      Section1aSumoLogicDeployment: '${SUMO_DEPLOYMENT}'
      Section1bSumoLogicAccessID: '${SUMO_ACCESS_ID}'
      Section1cSumoLogicAccessKey: '${SUMO_ACCESS_KEY}'
      Section1dSumoLogicOrganizationId: '${SUMO_ORG_ID}'
      Section2aAccountAlias: 'kfall'
      Section2bAccountAliasMappingS3URL: ''
      Section3aInstallObservabilityApps: 'Yes'
      Section4aCreateMetricsSourceOptions: 'Kinesis Firehose Metrics Source'
      Section5aAutoEnableS3LogsALBResourcesOptions: 'Both'
      Section5bALBCreateLogSource: 'Yes'
      Section6aCreateCloudTrailLogSource: 'Yes'
      Section7aCreateCloudWatchLogsSourceOptions: 'Kinesis Firehose Log Source'
      Section7cAutoSubscribeLogGroupsOptions: 'Both'
      Section8aAutoEnableS3LogsELBResourcesOptions: 'Both'
      Section8bELBCreateLogSource: 'Yes'
  Assertions:
    - AssertType: ResourceExistence
      Assert:
        Resources:
          - LambdaRole
          - LambdaPermission
          - PrimerInvoke
          - TelemetryLambda
          - CreateCommonResources
          - AutoEnableOptions
          - sumoAppStacks
          - sumoAppStacks.CreateSumoLogicAWSExplorerView
          - sumoAppStacks.SumoAppAWSEC2
          - sumoAppStacks.SumoAppAWSApplicationLoadBalancer
          - sumoAppStacks.SumoAppAWSClassicLoadBalancer
          - sumoAppStacks.SumoAppAWSDynamoDB
          - sumoAppStacks.SumoAppAmazonRDS
          - sumoAppStacks.SumoAppAWSAPIGateway
          - sumoAppStacks.SumoAppAmazonSNS
          - sumoAppStacks.SumoAppAmazonSQS
          - sumoAppStacks.SumoAppAWSLambda
          - sumoAppStacks.SumoAppAmazonECS
          - sumoAppStacks.SumoAppAmazonECSWithCI
          - sumoAppStacks.SumoAppAmazonElastiCache
          - sumoAppStacks.SumoAppAWSNetworkLoadBalancer
          - sumoAppStacks.SumoAppAmazonOverview
          - sumoAppStacks.SumoAppHostMetricsEC2
          - CreateCommonResources.LambdaRole
          - CreateCommonResources.LambdaHelper
          - CreateCommonResources.AccountCheck
          - CreateCommonResources.CommonBucketSNSTopic
          - CreateCommonResources.CommonS3Bucket
          - CreateCommonResources.ALBBucketPolicy
          - CreateCommonResources.ELBBucketPolicy
          - CreateCommonResources.CloudTrailBucketPolicy
          - CreateCommonResources.CommonCloudTrail
          - CreateCommonResources.CommonSNSpolicy
          - CreateCommonResources.SumoLogicSourceRole
          - CreateCommonResources.SumoLogicHostedCollector
          - CreateCommonResources.LambdaToDecideCWMetricsSources
          - CreateCommonResources.Primerinvoke
          - CreateCommonResources.ALBSource
          - CreateCommonResources.ALBSNSSubscription
          - CreateCommonResources.ELBSource
          - CreateCommonResources.ELBSNSSubscription
          - CreateCommonResources.CloudTrailSource
          - CreateCommonResources.CloudTrailSNSSubscription
          - CreateCommonResources.SumoLogicALBS3Policy
          - CreateCommonResources.SumoLogicELBS3Policy
          - CreateCommonResources.SumoLogicCloudTrailS3Policy
          - CreateCommonResources.AccountAliasValue
          - CreateCommonResources.LambdaHelperAlias
          - CreateCommonResources.LambdaRoleAlias
          - CreateCommonResources.KinesisFirehoseLogsSource
          - CreateCommonResources.KinesisFirehoseLogsStack
          - CreateCommonResources.KinesisFirehoseMetricsSource
          - CreateCommonResources.KinesisFirehoseMetricsStack
          - CreateCommonResources.KinesisFirehoseMetricsStack.AttachBucketPolicyToFirehoseLogsRole
          - CreateCommonResources.KinesisFirehoseMetricsStack.FirehoseLogsRole
          - CreateCommonResources.KinesisFirehoseMetricsStack.KinesisMetricsCloudWatchMetricsStream
          - CreateCommonResources.KinesisFirehoseMetricsStack.KinesisMetricsDeliveryStream
          - CreateCommonResources.KinesisFirehoseMetricsStack.KinesisMetricsFirehoseRolePolicy
          - CreateCommonResources.KinesisFirehoseMetricsStack.KinesisMetricsLogGroup
          - CreateCommonResources.KinesisFirehoseMetricsStack.KinesisMetricsLogStream
          - CreateCommonResources.KinesisFirehoseMetricsStack.KinesisMetricsLogStreamS3
          - CreateCommonResources.KinesisFirehoseMetricsStack.KinesisMetricsRole
          - CreateCommonResources.KinesisFirehoseMetricsStack.KinesisMetricsRolePolicy
          - CreateCommonResources.KinesisFirehoseMetricsStack.KinesisMetricsCloudWatchMetricsStreamLambda
          - CreateCommonResources.KinesisFirehoseMetricsStack.KinesisMetricsCloudWatchMetricsStreamLambdaRole
          - CreateCommonResources.KinesisFirehoseLogsStack.AttachBucketPolicyToFirehoseLogsRole
          - CreateCommonResources.KinesisFirehoseLogsStack.FirehoseLogsRole
          - CreateCommonResources.KinesisFirehoseLogsStack.KinesisLogsDeliveryStream
          - CreateCommonResources.KinesisFirehoseLogsStack.KinesisLogsFirehoseRolePolicy
          - CreateCommonResources.KinesisFirehoseLogsStack.KinesisLogsLogGroup
          - CreateCommonResources.KinesisFirehoseLogsStack.KinesisLogsLogStream
          - CreateCommonResources.KinesisFirehoseLogsStack.KinesisLogsLogStreamS3
          - CreateCommonResources.KinesisFirehoseLogsStack.KinesisLogsRole
          - CreateCommonResources.KinesisFirehoseLogsStack.KinesisLogsRolePolicy
          - CreateCommonResources.KinesisFirehoseLogsStack.SubscriptionFilter
          - AutoEnableOptions.AutoEnableS3LogsAlbStack
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.AutoEnableAlbLogEventsInvokePermission
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.AutoEnableAlbLogEventsRuleTrigger
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.EnableExisitngAWSResourcesLambda
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.EnableNewAWSResourcesLambda
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.ExistingAWSResources
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.SumoLambdaRole
          - AutoEnableOptions.AutoEnableS3LogsElbStack
          - AutoEnableOptions.AutoEnableS3LogsElbStack.AutoEnableElbLogEventsInvokePermission
          - AutoEnableOptions.AutoEnableS3LogsElbStack.AutoEnableElbLogEventsRuleTrigger
          - AutoEnableOptions.AutoEnableS3LogsElbStack.EnableExisitngAWSResourcesLambda
          - AutoEnableOptions.AutoEnableS3LogsElbStack.EnableNewAWSResourcesLambda
          - AutoEnableOptions.AutoEnableS3LogsElbStack.ExistingAWSResources
          - AutoEnableOptions.AutoEnableS3LogsElbStack.SumoLambdaRole
          - AutoEnableOptions.AutoSubscribeLambdaLogGroupsAWSResources
          - AutoEnableOptions.AutoSubscribeLambdaLogGroupsAWSResources.InvokeLambdaConnector
          - AutoEnableOptions.AutoSubscribeLambdaLogGroupsAWSResources.SumoLogGroupExistingLambdaConnector
          - AutoEnableOptions.AutoSubscribeLambdaLogGroupsAWSResources.SumoLogGroupExistingLambdaConnectorRole
          - AutoEnableOptions.AutoSubscribeLambdaLogGroupsAWSResources.SumoLogGroupLambdaConnector
          - AutoEnableOptions.AutoSubscribeLambdaLogGroupsAWSResources.AutoSubscribeCWLogGroupInvokePermission
          - AutoEnableOptions.AutoSubscribeLambdaLogGroupsAWSResources.SumoLogGroupLambdaEventRule
          - AutoEnableOptions.AutoSubscribeLambdaLogGroupsAWSResources.SumoLogGroupLambdaConnectorRole
          - AutoEnableOptions.AutoSubscribeLambdaLogGroupsAWSResources.sumoIAMPassRolePolicy
    - AssertType: OutputsCheck
      Assert:
        Outputs:
          - CreateCommonResources.LambdaHelperARN
          - CreateCommonResources.EnterpriseCheck
          - CreateCommonResources.PaidAccountCheck
          - CreateCommonResources.Namespaces
          - CreateCommonResources.LambdaRoleARN
          - CreateCommonResources.BucketName
          - CreateCommonResources.AccountAlias
          - CreateCommonResources.CollectorName
          - CreateCommonResources.KinesisMetricsRoleARN
          - CreateCommonResources.KinesisMetricsDeliveryStreamARN
          - CreateCommonResources.KinesisLogsDeliveryStreamARN
          - CreateCommonResources.KinesisLogsRoleARN
          - CreateCommonResources.KinesisFirehoseLogsStack.KinesisLogsLogGroupARN
          - CreateCommonResources.KinesisFirehoseLogsStack.KinesisLogsDeliveryStreamARN
          - CreateCommonResources.KinesisFirehoseLogsStack.KinesisLogsRoleARN
          - CreateCommonResources.KinesisFirehoseMetricsStack.KinesisMetricsRoleARN
          - CreateCommonResources.KinesisFirehoseMetricsStack.KinesisMetricsDeliveryStreamARN
          - CreateCommonResources.KinesisFirehoseMetricsStack.KinesisMetricsLogGroupARN
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.EnableExisitngAWSResourcesLambda
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.EnableNewAWSResourcesLambda
          - AutoEnableOptions.AutoEnableS3LogsElbStack.EnableExisitngAWSResourcesLambda
          - AutoEnableOptions.AutoEnableS3LogsElbStack.EnableNewAWSResourcesLambda
          - AutoEnableOptions.AutoSubscribeLambdaLogGroupsAWSResources.SumoLogGroupLambdaConnector
    - AssertType: ParameterCheck
      Assert:
        CreateCommonResources:
          CreateALBLogSource: 'Yes'
          CreateALBS3Bucket: 'Yes'
          ALBS3LogsBucketName: ""
          ALBLogsSourceName: "alb-logs-<REGION>"
          ALBLogsSourceCategory: "aws/observability/alb/logs"
          CreateELBLogSource: 'Yes'
          CreateELBS3Bucket: 'Yes'
          ELBS3LogsBucketName: ""
          ELBLogsSourceName: "classic-lb-logs-<REGION>"
          ELBLogsSourceCategory: "aws/observability/clb/logs"
          CreateCloudTrailLogSource: 'Yes'
          CreateCloudTrailBucket: 'Yes'
          CloudTrailLogsBucketName: ""
          CloudTrailLogsSourceName: "cloudtrail-logs-<REGION>"
          CloudTrailLogsSourceCategory: "aws/observability/cloudtrail/logs"
          CreateKinesisFirehoseMetricsSource: 'Yes'
          KinesisFirehoseMetricsSourceName: 'cloudwatch-metrics-<REGION>'
          KinesisFirehoseMetricSourceCategory: 'aws/observability/cloudwatch/metrics'
          CreateKinesisFirehoseLogSource: 'Yes'
          KinesisFirehoseLogsSourceName: 'kinesis-firehose-cloudwatch-logs-<REGION>'
          KinesisFirehoseLogsSourceCategory: 'aws/observability/cloudwatch/logs'
        CreateCommonResources.KinesisFirehoseMetricsStack:
          Section2aCreateS3Bucket: 'No'
        CreateCommonResources.KinesisFirehoseLogsStack:
          Section2aCreateS3Bucket: 'No'
        AutoEnableOptions:
          ALBAutoEnableS3Logs: 'Yes'
          ALBAutoEnableS3LogsOptions: "Both"
          ALBS3LogsBucketName: 'aws-observability-logs'
          ELBAutoEnableS3Logs: 'Yes'
          ELBAutoEnableS3LogsOptions: "Both"
          ELBS3LogsBucketName: 'aws-observability-logs'
          AutoSubscribeLogGroups: 'Yes'
          AutoSubscribeLogGroupsOptions: 'Both'
          AutoSubscribeDestinationARNType: 'Kinesis'
          AutoSubscribeDestinationARNValue: 'arn:<AWS_PARTITION>:firehose:'
          AutoSubscribeRoleArn: "arn:<AWS_PARTITION>:iam::"
        AutoEnableOptions.AutoEnableS3LogsAlbStack:
          BucketName: 'aws-observability-logs'
          AutoEnableResourceOptions: 'Both'
        AutoEnableOptions.AutoEnableS3LogsElbStack:
          BucketName: 'aws-observability-logs'
          AutoEnableResourceOptions: 'Both'
        AutoEnableOptions.AutoSubscribeLambdaLogGroupsAWSResources:
          UseExistingLogs: 'true'
          DestinationArnType: 'Kinesis'
          DestinationArnValue: 'arn:<AWS_PARTITION>:firehose:'
          RoleArn: "arn:<AWS_PARTITION>:iam::"
    # --- E2E PHASE (run AFTER PostRequisitesInfra) ---
    - AssertType: SumoSourceExistenceValidation
      Skip: false
      Assert:
        AccessId: "${SUMO_ACCESS_ID}"
        AccessKey: "${SUMO_ACCESS_KEY}"
        Deployment: "${SUMO_DEPLOYMENT}"

    - AssertType: SumoAppInstallationValidation
      Skip: false
      Assert:
        AccessId: "${SUMO_ACCESS_ID}"
        AccessKey: "${SUMO_ACCESS_KEY}"
        Deployment: "${SUMO_DEPLOYMENT}"

    - AssertType: AWSResourceValidation
      Skip: false
      Assert:
        ALB:
          LoadBalancers:
            - Arn: ""
              DnsName: ""
            - Arn: ""
              DnsName: ""
          HttpRequestCount: 10
          AccessLogCheckTimeoutSeconds: 240
          S3LogCheckTimeoutSeconds: 600
        ELB:
          LoadBalancers:
            - Name: ""
              DnsName: ""
            - Name: ""
              DnsName: ""
          HttpRequestCount: 10
          AccessLogCheckTimeoutSeconds: 240
          S3LogCheckTimeoutSeconds: 600
        CloudWatchLogGroups:
          ExpectedDestinationArn: ""
          LogEventCount: 10
          ExistingLogGroups:
            - Name: ""
              Arn: ""
              Type: "ByPattern"
            - Name: ""
              Arn: ""
              Type: "ByTags"
            - Name: ""
              Arn: ""
              Type: "Both"
          NewLogGroups:
            - Name: ""
              Arn: ""
              Type: "ByPattern"
            - Name: ""
              Arn: ""
              Type: "ByTags"
            - Name: ""
              Arn: ""
              Type: "Both"
          SubscriptionCheckTimeoutSeconds: 240

    - AssertType: SumoSourceLogsValidation
      Skip: false
      Assert:
        SourceQueryFilters:
          CloudtrailSourceQueries:
            - AppendQuery: "| json auto | where eventSource=\"lambda.amazonaws.com\""
            - AppendQuery: " \"2015-12-01\" | json auto | where eventSource=\"elasticloadbalancing.amazonaws.com\""
            - AppendQuery: "\"2012-06-01\" | json auto | where eventSource=\"elasticloadbalancing.amazonaws.com\""
          KinesisFirehoseMetricsSourceQueries:
            - AppendQuery: "namespace=AWS/ApplicationELB"
            - AppendQuery: "namespace=AWS/ELB"
            - AppendQuery: "namespace=AWS/Lambda"
            - AppendQuery: "namespace=AWS/EC2"
          KinesisFirehoseLogsSourceQueries:
            - AppendQuery: "| where namespace=\"aws/lambda\""
        AccessId: "${SUMO_ACCESS_ID}"
        AccessKey: "${SUMO_ACCESS_KEY}"
        Deployment: "${SUMO_DEPLOYMENT}"
        TimeoutSeconds: 600
