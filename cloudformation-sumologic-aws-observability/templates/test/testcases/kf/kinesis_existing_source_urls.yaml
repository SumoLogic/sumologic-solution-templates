---
Global:
  TemplatePath: "https://sumologic-appdev-aws-sam-apps.s3.amazonaws.com/aws-observability-versions/v3.0.0/templates/sumologic_observability.master.template.yaml"
  StackName: AWSO
  ParallelTestsRun: 1
  GlobalParameters:
    Default:
      Section1eSumoLogicResourceRemoveOnDeleteStack: 'true'
      Section2aAccountAlias: 'kfeu1'
TestCase:
  TestName: kinesisExistingSourceUrls
  Regions: '${SUMO_REGIONS}'
  Skip: false

  PreRequisitesInfra:
    # Create "existing" ALB (AWSO Existing Lambda enables access logs at deploy time)
    - Name: CreateALBInfra
      CFNTemplateURL: "test/setup-infra/create_alb_infra.yaml"
      ImpactedParametersPath:
        AlbArn:
          - "assertions[AssertType==AWSResourceValidation].Assert['ALB#LoadBalancers#0'].Arn"
        AlbDns:
          - "assertions[AssertType==AWSResourceValidation].Assert['ALB#LoadBalancers#0'].DnsName"
    # Create "existing" ELB (AWSO Existing Lambda enables access logs at deploy time)
    - Name: CreateELBInfra
      CFNTemplateURL: "test/setup-infra/create_elb_infra.yaml"
      ImpactedParametersPath:
        ElbName:
          - "assertions[AssertType==AWSResourceValidation].Assert['ELB#LoadBalancers#0'].Name"
        ElbDns:
          - "assertions[AssertType==AWSResourceValidation].Assert['ELB#LoadBalancers#0'].DnsName"
    - Name: CreateLambdaHelper
      CFNTemplateURL: "test/setup-infra/create_sumo_lambda_hepler.yaml"
      CFNParameters:
        SumoLogicDeployment: '${SUMO_DEPLOYMENT}'
        SumoLogicAccessID: '${SUMO_ACCESS_ID}'
        SumoLogicAccessKey: '${SUMO_ACCESS_KEY}'
        AccountAlias: "kfeu1"
    - Name: CreateCollector
      DependsOn: CreateLambdaHelper
      CFNTemplateURL: "test/setup-infra/create_sumo_collector.yaml"
      CFNParameters:
        SumoLogicDeployment: '${SUMO_DEPLOYMENT}'
        SumoLogicAccessID: '${SUMO_ACCESS_ID}'
        SumoLogicAccessKey: '${SUMO_ACCESS_KEY}'
        SumoLambdaHelperArn: '${SumoLambdaHelperArn}'
    - Name: CreateRole
      CFNTemplateURL: "test/setup-infra/create_sumo_role.yaml"
      CFNParameters:
        SumoLogicDeployment: '${SUMO_DEPLOYMENT}'
        SumoLogicOrganizationId: '${SUMO_ORG_ID}'
    - Name: CreateKFMetricsSource
      DependsOn: [CreateCollector, CreateRole]
      CFNTemplateURL: "test/setup-infra/create_sumo_kinesis_firehose_metrics_source.yaml"
      CFNParameters:
        SumoLogicDeployment: '${SUMO_DEPLOYMENT}'
        SumoLogicAccessID: '${SUMO_ACCESS_ID}'
        SumoLogicAccessKey: '${SUMO_ACCESS_KEY}'
        SumoLambdaHelperArn: '${SumoLambdaHelperArn}'
        SumoLogicSourceRoleArn: '${SumoLogicSourceRoleArn}'
        SumoCollectorID: '${SumoCollectorID}'
        AccountAlias: '${AccountAlias}'
      ImpactedParametersPath:
        SumoCloudWatchMetricsAPIURL:
          - "parameters.Section4cCloudWatchExistingSourceAPIUrl"
    - Name: CreateKFLogsSource
      DependsOn: CreateCollector
      CFNTemplateURL: "test/setup-infra/create_sumo_kinesis_firehose_logs_source.yaml"
      CFNParameters:
        SumoLogicDeployment: '${SUMO_DEPLOYMENT}'
        SumoLogicAccessID: '${SUMO_ACCESS_ID}'
        SumoLogicAccessKey: '${SUMO_ACCESS_KEY}'
        SumoLambdaHelperArn: '${SumoLambdaHelperArn}'
        SumoCollectorID: '${SumoCollectorID}'
        AccountAlias: '${AccountAlias}'
      ImpactedParametersPath:
        SumoKinesisFirehoseLogsAPIURL:
          - "parameters.Section7bCloudWatchLogsSourceUrl"

  PostRequisitesInfra:
    # Create "new" ALB and ELB — AWSO New EventBridge rule auto-enables access logs
    - Name: CreateALBInfra
      CFNTemplateURL: "test/setup-infra/create_alb_infra.yaml"
      WaitSeconds: 30
      ImpactedParametersPath:
        AlbArn:
          - "assertions[AssertType==AWSResourceValidation].Assert['ALB#LoadBalancers#1'].Arn"
        AlbDns:
          - "assertions[AssertType==AWSResourceValidation].Assert['ALB#LoadBalancers#1'].DnsName"
    - Name: CreateELBInfra
      CFNTemplateURL: "test/setup-infra/create_elb_infra.yaml"
      WaitSeconds: 30
      ImpactedParametersPath:
        ElbName:
          - "assertions[AssertType==AWSResourceValidation].Assert['ELB#LoadBalancers#1'].Name"
        ElbDns:
          - "assertions[AssertType==AWSResourceValidation].Assert['ELB#LoadBalancers#1'].DnsName"

  Parameters:
    Values:
      Section1aSumoLogicDeployment: '${SUMO_DEPLOYMENT}'
      Section1bSumoLogicAccessID: '${SUMO_ACCESS_ID}'
      Section1cSumoLogicAccessKey: '${SUMO_ACCESS_KEY}'
      Section1dSumoLogicOrganizationId: '${SUMO_ORG_ID}'
      Section2aAccountAlias: 'kfeu1'
      Section2bAccountAliasMappingS3URL: ''
      Section3aInstallObservabilityApps: 'No'
      Section4aCreateMetricsSourceOptions: 'None'
      Section4cCloudWatchExistingSourceAPIUrl: 'https://api.sumologic.com/api/v1/collectors/261725249/sources/1511494842'
      Section5aAutoEnableS3LogsALBResourcesOptions: 'Both'
      Section5bALBCreateLogSource: 'Yes'
      Section6aCreateCloudTrailLogSource: 'Yes'
      Section7aCreateCloudWatchLogsSourceOptions: 'None'
      Section7bCloudWatchLogsSourceUrl: 'https://api.sumologic.com/api/v1/collectors/261725249/sources/1511499202'
      Section8aAutoEnableS3LogsELBResourcesOptions: 'Both'
      Section8bELBCreateLogSource: 'Yes'
  Assertions:
    - AssertType: ResourceExistence
      Assert:
        Resources:
          - LambdaRole
          - LambdaPermission
          - PrimerInvoke
          - TelemetryLambda
          - CreateCommonResources
          - AutoEnableOptions
          - CreateCommonResources.LambdaRole
          - CreateCommonResources.LambdaHelper
          - CreateCommonResources.AccountCheck
          - CreateCommonResources.CommonBucketSNSTopic
          - CreateCommonResources.CommonS3Bucket
          - CreateCommonResources.ALBBucketPolicy
          - CreateCommonResources.ELBBucketPolicy
          - CreateCommonResources.CloudTrailBucketPolicy
          - CreateCommonResources.CommonCloudTrail
          - CreateCommonResources.CommonSNSpolicy
          - CreateCommonResources.SumoLogicSourceRole
          - CreateCommonResources.SumoLogicHostedCollector
          - CreateCommonResources.LambdaToDecideCWMetricsSources
          - CreateCommonResources.Primerinvoke
          - CreateCommonResources.ALBSource
          - CreateCommonResources.ALBSNSSubscription
          - CreateCommonResources.ELBSource
          - CreateCommonResources.ELBSNSSubscription
          - CreateCommonResources.CloudTrailSource
          - CreateCommonResources.CloudTrailSNSSubscription
          - CreateCommonResources.SumoLogicALBS3Policy
          - CreateCommonResources.SumoLogicELBS3Policy
          - CreateCommonResources.SumoLogicCloudTrailS3Policy
          - CreateCommonResources.AccountAliasValue
          - CreateCommonResources.LambdaHelperAlias
          - CreateCommonResources.LambdaRoleAlias
          # update_metrics_source=true: Section4a=None + Section4c URL provided
          - CreateCommonResources.SumoMetricsUpdateSource
          # update_cloudwatch_source=true: Section7a=None + Section7b URL provided
          - CreateCommonResources.SumoHTTPUpdateSource
          # No KinesisFirehoseMetricsStack — Section4a=None
          # No KinesisFirehoseLogsStack  — Section7a=None
          - AutoEnableOptions.AutoEnableS3LogsAlbStack
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.AutoEnableAlbLogEventsInvokePermission
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.AutoEnableAlbLogEventsRuleTrigger
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.EnableExisitngAWSResourcesLambda
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.EnableNewAWSResourcesLambda
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.ExistingAWSResources
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.SumoLambdaRole
          - AutoEnableOptions.AutoEnableS3LogsElbStack
          - AutoEnableOptions.AutoEnableS3LogsElbStack.AutoEnableElbLogEventsInvokePermission
          - AutoEnableOptions.AutoEnableS3LogsElbStack.AutoEnableElbLogEventsRuleTrigger
          - AutoEnableOptions.AutoEnableS3LogsElbStack.EnableExisitngAWSResourcesLambda
          - AutoEnableOptions.AutoEnableS3LogsElbStack.EnableNewAWSResourcesLambda
          - AutoEnableOptions.AutoEnableS3LogsElbStack.ExistingAWSResources
          - AutoEnableOptions.AutoEnableS3LogsElbStack.SumoLambdaRole
    - AssertType: OutputsCheck
      Assert:
        Outputs:
          - CreateCommonResources.LambdaHelperARN
          - CreateCommonResources.EnterpriseCheck
          - CreateCommonResources.PaidAccountCheck
          - CreateCommonResources.Namespaces
          - CreateCommonResources.LambdaRoleARN
          - CreateCommonResources.BucketName
          - CreateCommonResources.AccountAlias
          - CreateCommonResources.CollectorName
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.EnableExisitngAWSResourcesLambda
          - AutoEnableOptions.AutoEnableS3LogsAlbStack.EnableNewAWSResourcesLambda
          - AutoEnableOptions.AutoEnableS3LogsElbStack.EnableExisitngAWSResourcesLambda
          - AutoEnableOptions.AutoEnableS3LogsElbStack.EnableNewAWSResourcesLambda
          - CreateCommonResources.ExistingMetricSourceName
          - CreateCommonResources.ExistingCloudWatchLogSourceName
    - AssertType: ParameterCheck
      Assert:
        CreateCommonResources:
          CreateALBLogSource: 'Yes'
          CreateALBS3Bucket: 'Yes'
          ALBS3LogsBucketName: ""
          ALBLogsSourceName: "alb-logs-<REGION>"
          ALBLogsSourceCategory: "aws/observability/alb/logs"
          CreateELBLogSource: 'Yes'
          CreateELBS3Bucket: 'Yes'
          ELBS3LogsBucketName: ""
          ELBLogsSourceName: "classic-lb-logs-<REGION>"
          ELBLogsSourceCategory: "aws/observability/clb/logs"
          CreateCloudTrailLogSource: 'Yes'
          CreateCloudTrailBucket: 'Yes'
          CloudTrailLogsBucketName: ""
          CloudTrailLogsSourceName: "cloudtrail-logs-<REGION>"
          CloudTrailLogsSourceCategory: "aws/observability/cloudtrail/logs"
          CreateCloudWatchMetricsSource: 'No'
          CloudWatchMetricsSourceName: 'cloudwatch-metrics-<REGION>'
          CreateKinesisFirehoseMetricsSource: 'No'
          KinesisFirehoseMetricsSourceName: 'cloudwatch-metrics-<REGION>'
          KinesisFirehoseMetricSourceCategory: 'aws/observability/cloudwatch/metrics'
          CreateKinesisFirehoseLogSource: 'No'
          KinesisFirehoseLogsSourceName: 'kinesis-firehose-cloudwatch-logs-<REGION>'
          KinesisFirehoseLogsSourceCategory: 'aws/observability/cloudwatch/logs'
        AutoEnableOptions:
          ALBAutoEnableS3Logs: 'Yes'
          ALBAutoEnableS3LogsOptions: 'Both'
          ALBS3LogsBucketName: 'aws-observability-logs'
          ELBAutoEnableS3Logs: 'Yes'
          ELBAutoEnableS3LogsOptions: 'Both'
          ELBS3LogsBucketName: 'aws-observability-logs'
          AutoSubscribeLogGroups: 'No'
        AutoEnableOptions.AutoEnableS3LogsAlbStack:
          BucketName: 'aws-observability-logs'
          AutoEnableResourceOptions: 'Both'
        AutoEnableOptions.AutoEnableS3LogsElbStack:
          BucketName: 'aws-observability-logs'
          AutoEnableResourceOptions: 'Both'
    # --- E2E PHASE (run AFTER PostRequisitesInfra) ---
    - AssertType: SumoSourceExistenceValidation
      Skip: false
      Assert:
        AccessId: "${SUMO_ACCESS_ID}"
        AccessKey: "${SUMO_ACCESS_KEY}"
        Deployment: "${SUMO_DEPLOYMENT}"

    - AssertType: AWSResourceValidation
      Skip: false
      Assert:
        ALB:
          LoadBalancers:
            - Arn: ""
              DnsName: ""
            - Arn: ""
              DnsName: ""
          HttpRequestCount: 10
          AccessLogCheckTimeoutSeconds: 240
          S3LogCheckTimeoutSeconds: 600
        ELB:
          LoadBalancers:
            - Name: ""
              DnsName: ""
            - Name: ""
              DnsName: ""
          HttpRequestCount: 10
          AccessLogCheckTimeoutSeconds: 240
          S3LogCheckTimeoutSeconds: 600

    - AssertType: SumoSourceLogsValidation
      Skip: false
      Assert:
        SourceQueryFilters:
          CloudtrailSourceQueries:
            - AppendQuery: "| json auto | where eventSource=\"lambda.amazonaws.com\""
            - AppendQuery: " \"2015-12-01\" | json auto | where eventSource=\"elasticloadbalancing.amazonaws.com\""
            - AppendQuery: "\"2012-06-01\" | json auto | where eventSource=\"elasticloadbalancing.amazonaws.com\""
        AccessId: "${SUMO_ACCESS_ID}"
        AccessKey: "${SUMO_ACCESS_KEY}"
        Deployment: "${SUMO_DEPLOYMENT}"
        TimeoutSeconds: 600
