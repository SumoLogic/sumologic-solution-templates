AWSTemplateFormatVersion: '2010-09-09'
Description: "Version - v3.1.0: Template to setup static outbound IP (NAT Gateway with Elastic IP) network for AWS Observability Lambda functions calling Sumo Logic APIs when Sumo Logic API allowlist is enabled. Network details are stored in SSM Parameter Store and picked up automatically by AWS Observability. Deploy this stack before AWS Observability and add the NatPublicIp output to Sumo Logic API allowlist."

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W1030
  'AWS::CloudFormation::Interface':
    ParameterGroups:
      - Label:
          default: "1. Network Option"
        Parameters:
          - Section1aNetworkOption
          - Section1bElasticIPAllocationId

      - Label:
          default: "2. New VPC Configuration"
        Parameters:
          - Section2aVpcCidr

      - Label:
          default: "3. Existing VPC Configuration"
        Parameters:
          - Section3aExistingVpcId
          - Section3bExistingPrivateSubnetIds
          - Section3cExistingSecurityGroupId

    ParameterLabels:
      Section1aNetworkOption:
        default: "Network Option"
      Section1bElasticIPAllocationId:
        default: "Existing Elastic IP Allocation ID"
      Section2aVpcCidr:
        default: "New VPC CIDR Block"
      Section3aExistingVpcId:
        default: "Existing VPC ID"
      Section3bExistingPrivateSubnetIds:
        default: "Existing Private Subnet IDs"
      Section3cExistingSecurityGroupId:
        default: "Existing Security Group ID"

Parameters:
  Section1aNetworkOption:
    Type: String
    Description: "NewVPC - Creates a new VPC with Internet Gateway, public subnet, NAT Gateway with Elastic IP and two private subnets.
                  ExistingVPC - Uses an existing VPC. Validates what is provided (VPC, private subnets, Elastic IP, security group) and creates only the missing components. Provide the inputs as parameters (single account) or publish them in SSM Parameter Store under /sumologic/awso/network/ (vpc-id, private-subnet-ids, elastic-ip-allocation-id, security-group-id) in each account and region (StackSets). Parameters win over SSM."
    Default: 'NewVPC'
    AllowedValues:
      - 'NewVPC'
      - 'ExistingVPC'
  Section1bElasticIPAllocationId:
    Type: String
    Description: "Optional. Provide an existing Elastic IP allocation ID (eipalloc-xxxx) already added to Sumo Logic API allowlist. Used only when a NAT Gateway is created. If blank, SSM parameter /sumologic/awso/network/elastic-ip-allocation-id is used for ExistingVPC when present, otherwise a new Elastic IP is allocated."
    Default: ""
    AllowedPattern: "^$|^eipalloc-[0-9a-f]+$"
    ConstraintDescription: "Elastic IP allocation ID must be blank or start with eipalloc-."

  Section2aVpcCidr:
    Type: String
    Description: "Required when Network Option is NewVPC. CIDR block (/16 to /24) for the new VPC. Split into one public and two private subnets."
    Default: "10.250.0.0/24"
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}\\/(1[6-9]|2[0-4])$"
    ConstraintDescription: "Must be a valid IPv4 CIDR block between /16 and /24."

  Section3aExistingVpcId:
    Type: String
    Description: "Used when Network Option is ExistingVPC. Provide the existing VPC ID (vpc-xxxx). If blank, the VPC ID is read from SSM parameter /sumologic/awso/network/vpc-id in this account and region, which lets StackSets use one set of parameters for all accounts and regions."
    Default: ""
    AllowedPattern: "^$|^vpc-[0-9a-f]+$"
    ConstraintDescription: "VPC ID must be blank or start with vpc-."
  Section3bExistingPrivateSubnetIds:
    Type: CommaDelimitedList
    Description: "Optional, used when Network Option is ExistingVPC. Comma separated private subnet IDs routing 0.0.0.0/0 to a NAT Gateway. If blank, SSM parameter /sumologic/awso/network/private-subnet-ids is used when present, otherwise NAT routed subnets are discovered or created."
    Default: ""
  Section3cExistingSecurityGroupId:
    Type: String
    Description: "Optional, used when Network Option is ExistingVPC. Existing security group ID (sg-xxxx) for the Lambda functions. It must be in the VPC and allow outbound tcp/443, it is never modified. If blank, SSM parameter /sumologic/awso/network/security-group-id is used when present, otherwise a security group is created."
    Default: ""
    AllowedPattern: "^$|^sg-[0-9a-f]+$"
    ConstraintDescription: "Security group ID must be blank or start with sg-."

Conditions:
  new_vpc: !Equals [ !Ref Section1aNetworkOption, 'NewVPC' ]
  existing_vpc: !Equals [ !Ref Section1aNetworkOption, 'ExistingVPC' ]
  eip_provided: !Not [ !Equals [ !Ref Section1bElasticIPAllocationId, '' ] ]
  create_eip: !And
    - !Condition new_vpc
    - !Not [ !Condition eip_provided ]
  lookup_eip: !And
    - !Condition new_vpc
    - !Condition eip_provided
  use_helper: !Or
    - !Condition existing_vpc
    - !Condition lookup_eip

Mappings:
  # AWS Observability reads the network details from this fixed path. Customers can also publish ExistingVPC inputs
  # here: vpc-id (required for ExistingVPC when the VPC ID parameter is blank), private-subnet-ids,
  # elastic-ip-allocation-id and security-group-id (all optional).
  StaticOutboundIP:
    SSM:
      Prefix: "/sumologic/awso/network"
  RegionMap:
    us-east-1:
      bucketname: appdevzipfiles-us-east-1
    us-east-2:
      bucketname: appdevzipfiles-us-east-2
    us-west-1:
      bucketname: appdevzipfiles-us-west-1
    us-west-2:
      bucketname: appdevzipfiles-us-west-2
    ap-south-1:
      bucketname: appdevzipfiles-ap-south-1
    ap-northeast-2:
      bucketname: appdevzipfiles-ap-northeast-2
    ap-southeast-1:
      bucketname: appdevzipfiles-ap-southeast-1
    ap-southeast-2:
      bucketname: appdevzipfiles-ap-southeast-2
    ap-southeast-4:
      bucketname: appdevzipfiles-ap-southeast-4s
    ap-southeast-6:
      bucketname: appdevzipfiles-ap-southeast-6ss
    ap-northeast-1:
      bucketname: appdevzipfiles-ap-northeast-1
    ca-central-1:
      bucketname: appdevzipfiles-ca-central-1
    eu-central-1:
      bucketname: appdevzipfiles-eu-central-1
    eu-west-1:
      bucketname: appdevzipfiles-eu-west-1
    eu-west-2:
      bucketname: appdevzipfiles-eu-west-2
    eu-west-3:
      bucketname: appdevzipfiles-eu-west-3
    eu-north-1:
      bucketname: appdevzipfiles-eu-north-1s
    sa-east-1:
      bucketname: appdevzipfiles-sa-east-1
    ap-east-1:
      bucketname: appdevzipfiles-ap-east-1s
    af-south-1:
      bucketname: appdevzipfiles-af-south-1s
    eu-south-1:
      bucketname: appdevzipfiles-eu-south-1
    me-south-1:
      bucketname: appdevzipfiles-me-south-1s
    me-central-1:
      bucketname: appdevzipfiles-me-central-1
    eu-central-2:
        bucketname: appdevzipfiles-eu-central-2ss
    ap-northeast-3:
        bucketname: appdevzipfiles-ap-northeast-3s
    ap-southeast-3:
        bucketname: appdevzipfiles-ap-southeast-3

Resources:
  # ---------------------------------------------------------------
  # NewVPC - VPC, IGW, public subnet, NAT Gateway, private subnets
  # ---------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Condition: new_vpc
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W60
            reason: "VPC is used only by AWS Observability Lambda functions for outbound Sumo Logic API calls, flow logs are not required."
    Properties:
      CidrBlock: !Ref Section2aVpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: sumologic-awso-vpc
        - Key: CreatedBy
          Value: sumologic-awso

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: new_vpc
    Properties:
      Tags:
        - Key: Name
          Value: sumologic-awso-igw
        - Key: CreatedBy
          Value: sumologic-awso

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: new_vpc
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: new_vpc
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [ 0, !Cidr [ !Ref Section2aVpcCidr, 3, 6 ] ]
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: sumologic-awso-public-subnet
        - Key: CreatedBy
          Value: sumologic-awso

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: new_vpc
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: sumologic-awso-public-rt
        - Key: CreatedBy
          Value: sumologic-awso

  PublicRoute:
    Type: AWS::EC2::Route
    Condition: new_vpc
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: new_vpc
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEIP:
    Type: AWS::EC2::EIP
    Condition: create_eip
    DeletionPolicy: Delete
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: sumologic-awso-nat-eip
        - Key: CreatedBy
          Value: sumologic-awso

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: new_vpc
    DependsOn: PublicRoute
    Properties:
      AllocationId: !If [ eip_provided, !Ref Section1bElasticIPAllocationId, !GetAtt NatEIP.AllocationId ]
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: sumologic-awso-nat
        - Key: CreatedBy
          Value: sumologic-awso

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Condition: new_vpc
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [ 1, !Cidr [ !Ref Section2aVpcCidr, 3, 6 ] ]
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: sumologic-awso-private-subnet-1
        - Key: CreatedBy
          Value: sumologic-awso

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Condition: new_vpc
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [ 2, !Cidr [ !Ref Section2aVpcCidr, 3, 6 ] ]
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: sumologic-awso-private-subnet-2
        - Key: CreatedBy
          Value: sumologic-awso

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: new_vpc
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: sumologic-awso-private-rt
        - Key: CreatedBy
          Value: sumologic-awso

  PrivateRoute:
    Type: AWS::EC2::Route
    Condition: new_vpc
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: new_vpc
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: new_vpc
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ---------------------------------------------------------------
  # Helper Lambda - Elastic IP lookup and ExistingVPC validation
  # ---------------------------------------------------------------
  StaticIpNetworkSetupRole:
    Type: AWS::IAM::Role
    Condition: use_helper
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "EC2 network resources are discovered at runtime, delete actions are restricted to resources tagged CreatedBy=sumologic-awso."
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: AwsObservabilityNetworkHelperPolicies
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:DescribeAddresses
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeNatGateways
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:DescribeVpcAttribute
                  - ec2:DescribeSecurityGroups
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:CreateSubnet
                  - ec2:CreateRouteTable
                  - ec2:CreateRoute
                  - ec2:AssociateRouteTable
                  - ec2:CreateInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:CreateNatGateway
                  - ec2:AllocateAddress
                  - ec2:AssociateAddress
                  - ec2:CreateSecurityGroup
                  - ec2:AuthorizeSecurityGroupEgress
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:CreateTags
                Resource: '*'
                Condition:
                  StringEquals:
                    ec2:CreateAction:
                      - CreateSubnet
                      - CreateRouteTable
                      - CreateInternetGateway
                      - CreateNatGateway
                      - AllocateAddress
                      - CreateSecurityGroup
              - Effect: Allow
                Action:
                  - ec2:DeleteSubnet
                  - ec2:DeleteRouteTable
                  - ec2:DeleteRoute
                  - ec2:DisassociateRouteTable
                  - ec2:DetachInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:DeleteNatGateway
                  - ec2:ReleaseAddress
                  - ec2:DisassociateAddress
                  - ec2:DeleteSecurityGroup
                  - ec2:RevokeSecurityGroupEgress
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceTag/CreatedBy: sumologic-awso
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:PutParameter
                  - ssm:AddTagsToResource
                  - ssm:ListTagsForResource
                Resource: !Sub
                  - "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SSMPrefix}/*"
                  - SSMPrefix: !FindInMap [ StaticOutboundIP, SSM, Prefix ]
              - Effect: Allow
                Action:
                  - ssm:DeleteParameter
                Resource: !Sub
                  - "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SSMPrefix}/*"
                  - SSMPrefix: !FindInMap [ StaticOutboundIP, SSM, Prefix ]
                Condition:
                  StringEquals:
                    aws:ResourceTag/CreatedBy: sumologic-awso

  StaticIpNetworkSetupFunction:
    Type: AWS::Lambda::Function
    Condition: use_helper
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Lambda function only calls EC2 APIs and does not require VPC deployment."
          - id: W92
            reason: "Lambda function does not require reserved concurrency."
    Properties:
      Handler: main.handler
      Runtime: python3.14
      Description: "Lambda Function to validate and setup static outbound IP network for SumoLogic AWS Observability Solution."
      Code:
        S3Bucket: !FindInMap [ RegionMap, !Ref 'AWS::Region', bucketname ]
        S3Key: "sumologic-aws-observability/functions/sumo-app-utils/v3.1.0/sumo-app-utils.zip"
      MemorySize: 128
      Timeout: 900
      Role: !GetAtt StaticIpNetworkSetupRole.Arn

  ElasticIPLookup:
    Type: Custom::ElasticIPLookup
    Condition: lookup_eip
    Properties:
      ServiceToken: !GetAtt StaticIpNetworkSetupFunction.Arn
      AllocationId: !Ref Section1bElasticIPAllocationId

  VPCNetworkSetup:
    Type: Custom::VPCNetworkSetup
    Condition: existing_vpc
    Properties:
      ServiceToken: !GetAtt StaticIpNetworkSetupFunction.Arn
      VpcId: !Ref Section3aExistingVpcId
      ElasticIPAllocationId: !Ref Section1bElasticIPAllocationId
      PrivateSubnetIds: !Join [ ",", !Ref Section3bExistingPrivateSubnetIds ]
      SecurityGroupId: !Ref Section3cExistingSecurityGroupId
      StackId: !Ref AWS::StackId
      SSMPrefix: !FindInMap [ StaticOutboundIP, SSM, Prefix ]

  # ---------------------------------------------------------------
  # Common - Lambda security group and SSM parameters
  # ---------------------------------------------------------------
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: new_vpc
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "Lambda functions call Sumo Logic APIs over HTTPS, Sumo Logic API endpoints are not fixed IPs."
    Properties:
      GroupDescription: "SumoLogic AWS Observability Lambda functions - outbound HTTPS to Sumo Logic APIs"
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: "HTTPS to Sumo Logic APIs"
      Tags:
        - Key: Name
          Value: sumologic-awso-lambda-sg
        - Key: CreatedBy
          Value: sumologic-awso

  SSMPrivateSubnetIds:
    Type: AWS::SSM::Parameter
    Condition: new_vpc
    Properties:
      Name: !Sub
        - "${SSMPrefix}/private-subnet-ids"
        - SSMPrefix: !FindInMap [ StaticOutboundIP, SSM, Prefix ]
      Type: StringList
      Description: "Private subnets (routed through NAT Gateway) for SumoLogic AWS Observability Lambda functions."
      Value: !Join [ ",", [ !Ref PrivateSubnetA, !Ref PrivateSubnetB ] ]

  SSMSecurityGroupId:
    Type: AWS::SSM::Parameter
    Condition: new_vpc
    Properties:
      Name: !Sub
        - "${SSMPrefix}/security-group-id"
        - SSMPrefix: !FindInMap [ StaticOutboundIP, SSM, Prefix ]
      Type: String
      Description: "Security group for SumoLogic AWS Observability Lambda functions."
      Value: !GetAtt LambdaSecurityGroup.GroupId

  SSMVpcId:
    Type: AWS::SSM::Parameter
    Condition: new_vpc
    Properties:
      Name: !Sub
        - "${SSMPrefix}/vpc-id"
        - SSMPrefix: !FindInMap [ StaticOutboundIP, SSM, Prefix ]
      Type: String
      Description: "VPC for SumoLogic AWS Observability Lambda functions."
      Value: !Ref VPC

  # Written last, AWS Observability treats the network as configured only once this parameter exists.
  SSMNatPublicIp:
    Type: AWS::SSM::Parameter
    Condition: new_vpc
    DependsOn:
      - SSMPrivateSubnetIds
      - SSMSecurityGroupId
      - SSMVpcId
    Properties:
      Name: !Sub
        - "${SSMPrefix}/nat-public-ip"
        - SSMPrefix: !FindInMap [ StaticOutboundIP, SSM, Prefix ]
      Type: String
      Description: "Static outbound IP of SumoLogic AWS Observability Lambda functions. Add this IP to Sumo Logic API allowlist."
      Value: !If [ eip_provided, !GetAtt ElasticIPLookup.PublicIp, !Ref NatEIP ]

Outputs:
  VpcId:
    Description: "VPC ID used by SumoLogic AWS Observability Lambda functions."
    Value: !If [ new_vpc, !Ref VPC, !GetAtt VPCNetworkSetup.VpcId ]
  PrivateSubnetIds:
    Description: "Private subnet IDs used by SumoLogic AWS Observability Lambda functions."
    Value: !If
      - new_vpc
      - !Join [ ",", [ !Ref PrivateSubnetA, !Ref PrivateSubnetB ] ]
      - !GetAtt VPCNetworkSetup.SubnetIds
  SecurityGroupId:
    Description: "Security group ID used by SumoLogic AWS Observability Lambda functions."
    Value: !If [ new_vpc, !GetAtt LambdaSecurityGroup.GroupId, !GetAtt VPCNetworkSetup.SecurityGroupId ]
  NatPublicIp:
    Description: "Add this IP to the Sumo Logic API allowlist before deploying AWS Observability."
    Value: !If [ new_vpc, !GetAtt SSMNatPublicIp.Value, !GetAtt VPCNetworkSetup.NatPublicIp ]
